name: limited-download

on:
  workflow_dispatch:
    inputs:
      comic_ids:
        description: '漫画 ID，逗号分隔，单次最多 3 本'
        required: true
        type: string
      episodes:
        description: '章节，例如 all、1,3,5-10'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: limited-download-${{ github.repository }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PICA_ACCOUNT: ${{ secrets.PICA_ACCOUNT }}
      PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
      PICA_DL_CONCURRENCY: '3'
      INPUT_COMIC_IDS: ${{ inputs.comic_ids }}
      INPUT_EPISODES: ${{ inputs.episodes }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PICA_ACCOUNT" && test -n "$PICA_PASSWORD" || {
            echo '请先设置 PICA_ACCOUNT 和 PICA_PASSWORD Repository Secrets。'
            exit 1
          }
          IFS=',' read -ra ids <<< "$INPUT_COMIC_IDS"
          test "${#ids[@]}" -ge 1 && test "${#ids[@]}" -le 3 || {
            echo '单次只能下载 1 至 3 本漫画。'
            exit 1
          }
          for id in "${ids[@]}"; do
            [[ "${id// /}" =~ ^[A-Za-z0-9_-]{8,64}$ ]] || {
              echo '漫画 ID 格式无效。'
              exit 1
            }
          done
          [[ "$INPUT_EPISODES" == 'all' || "$INPUT_EPISODES" =~ ^[0-9,-]{1,80}$ ]] || {
            echo '章节格式无效。'
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Download requested comics
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "$INPUT_COMIC_IDS"
          args=()
          for id in "${ids[@]}"; do args+=("${id// /}"); done
          node dist/library-cli.js download "${args[@]}" \
            --episodes "$INPUT_EPISODES" \
            --concurrency 3 \
            --data-dir .pica-library-action

      - name: Upload temporary download
        uses: actions/upload-artifact@v4
        with:
          name: pica-download-${{ github.run_id }}
          path: .pica-library-action/library/objects
          if-no-files-found: error
          retention-days: 1

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 下载任务'
            echo ''
            echo '单次最多 3 本、并发 3、最长 30 分钟；成功产物保留 1 天。'
            echo '请仅下载你有权访问和保存的内容，不要将产物用于公开再分发。'
          } >> "$GITHUB_STEP_SUMMARY"
