<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Pica Library</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <header>
            <div>
                <p class="eyebrow">LOCAL-FIRST COMIC LIBRARY</p>
                <h1>Pica Library</h1>
                <p class="subtitle">收藏同步、作者归一、搜索推荐与增量下载</p>
            </div>
            <div id="mode" class="mode">正在检测运行模式…</div>
        </header>

        <nav>
            <button data-view="dashboard" class="active">概览</button>
            <button data-view="library">收藏库</button>
            <button data-view="authors">作者归一</button>
            <button data-view="discover">站内搜索</button>
        </nav>

        <main>
            <section id="dashboard" class="view active">
                <div id="summary" class="cards"></div>
                <article class="panel">
                    <h2>导入收藏数据</h2>
                    <p>
                        Lite 模式只在浏览器本地处理 CSV；连接本地引擎后可写入
                        SQLite。
                    </p>
                    <div class="row">
                        <input
                            id="import-file"
                            type="file"
                            accept=".csv,.json"
                        />
                        <button id="import-button" class="primary">导入</button>
                        <button id="sync-button">从站内同步收藏</button>
                    </div>
                    <p id="import-result" class="muted"></p>
                </article>
                <article class="panel">
                    <h2>工作方式</h2>
                    <ol>
                        <li>同步或导入收藏元数据。</li>
                        <li>审核作者与社团候选关系。</li>
                        <li>使用 Tag、作者和热度生成下载计划。</li>
                        <li>完整版只下载缺失章节与图片。</li>
                    </ol>
                </article>
            </section>

            <section id="library" class="view">
                <div class="toolbar">
                    <input id="filter-text" placeholder="标题或作者" />
                    <input id="filter-tag" placeholder="Tag（逗号分隔）" />
                    <select id="sort-mode">
                        <option value="latest">最近更新</option>
                        <option value="likes">爱心数</option>
                        <option value="views">浏览量</option>
                        <option value="title">标题</option>
                        <option value="recommended">综合推荐</option>
                    </select>
                    <button id="apply-filter" class="primary">筛选</button>
                    <button id="export-plan">导出下载计划</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th></th>
                                <th>标题</th>
                                <th>归一作者</th>
                                <th>Tag</th>
                                <th>爱心</th>
                                <th>浏览</th>
                                <th>更新</th>
                                <th>本地进度</th>
                            </tr>
                        </thead>
                        <tbody id="comic-rows"></tbody>
                    </table>
                </div>
            </section>

            <section id="authors" class="view">
                <div class="toolbar">
                    <label
                        ><input id="pending-only" type="checkbox" />
                        仅待审核</label
                    >
                    <button id="refresh-authors">刷新</button>
                    <button id="export-aliases">导出作者字典</button>
                    <input id="alias-file" type="file" accept=".json" />
                    <button id="import-aliases">导入作者字典</button>
                </div>
                <div class="toolbar">
                    <span>勾选至少两个作者后：</span>
                    <input
                        id="merge-name"
                        placeholder="合并后的规范名称（可选）"
                    />
                    <button id="merge-authors" class="primary">
                        合并所选作者
                    </button>
                    <button id="organize-library">重建本地作者目录</button>
                </div>
                <div id="author-list" class="author-list"></div>
            </section>

            <section id="discover" class="view">
                <article class="panel">
                    <h2>站内搜索与排序</h2>
                    <div class="search-grid">
                        <input
                            id="search-keyword"
                            placeholder="关键词（可留空）"
                        />
                        <input id="search-tags" placeholder="Tag，逗号分隔" />
                        <input
                            id="search-categories"
                            placeholder="分类，逗号分隔"
                        />
                        <select id="search-sort">
                            <option value="likes">爱心数</option>
                            <option value="views">浏览量</option>
                            <option value="latest">最近更新</option>
                            <option value="recommended">综合推荐</option>
                        </select>
                        <button id="search-button" class="primary">搜索</button>
                    </div>
                    <p id="search-message" class="muted"></p>
                </article>
                <div id="search-results" class="result-grid"></div>
            </section>
        </main>

        <template id="author-template">
            <article class="author-card">
                <input class="author-select" type="checkbox" />
                <div>
                    <p class="author-name"></p>
                    <p class="author-meta muted"></p>
                    <p class="author-evidence"></p>
                </div>
                <div class="author-actions">
                    <button data-decision="approved">确认</button>
                    <button data-decision="keep_separate">保持分离</button>
                    <button data-decision="needs_research">待研究</button>
                </div>
            </article>
        </template>
        <script type="module" src="./app.js"></script>
    </body>
</html>
