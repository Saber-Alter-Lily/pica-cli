name: task

on:
  workflow_dispatch:
    inputs:
      PICA_DL_CONTENT:
        description: '想下点什么？搜索/收藏夹/排行榜'
        required: true
        type: choice
        default: search
        options:
          - search
          - favorites
          - leaderboard
      PICA_DL_FAV_PAGE:
        description: '指定下载收藏夹的第几页'
        type: 'string'
        default: '全部'
      PICA_DL_SEARCH_KEYWORDS:
        description: '搜索关键字或者漫画ID (多个用 # 隔开)'
        type: string
      PICA_DL_CHAPTER:
        description: '指定下载章节 (示例：1,3,5-20)'
        type: string
        default: '全部'
      OUTPUT_ZIP:
        description: '每个章节打成独立压缩包'
        type: boolean
        default: true
      UPLOAD_FILEIO:
        description: '上传到 file.io'
        type: boolean
        default: true
      # PICA_DL_CONCURRENCY:
      #   description: '下载并发数'
      #   required: true
      #   type: number
      #   default: 5
      PICA_PRINT_FAVS:
        description: '打印收藏夹的全部内容'
        type: boolean
        default: false
      DEBUG:
        description: '调试模式'
        type: boolean
        default: false

env:
  DEBUG: ${{ inputs.DEBUG && 'pica' }}
  PICA_PRINT_FAVS: ${{ inputs.PICA_PRINT_FAVS && 'true' || '' }}
  PICA_IN_GITHUB: true # 用于区分运行环境，不要修改
  PICA_ACCOUNT: ${{ secrets.PICA_ACCOUNT }}
  PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
  CODEX_PICA_RANDOM_IDS: ${{ secrets.CODEX_PICA_RANDOM_IDS }}
  # PICA_DL_CONCURRENCY: ${{ inputs.PICA_DL_CONCURRENCY }}
  PICA_DL_CONTENT: ${{ inputs.PICA_DL_CONTENT }}
  PICA_DL_SEARCH_KEYWORDS: ${{ secrets.CODEX_PICA_RANDOM_IDS || inputs.PICA_DL_SEARCH_KEYWORDS }}
  PICA_DL_CHAPTER: ${{ inputs.PICA_DL_CHAPTER }}
  PICA_DL_FAV_PAGE: ${{ inputs.PICA_DL_FAV_PAGE }}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps and build
        run: |
          pnpm install
          pnpm run build

      - name: Download
        if: ${{ !inputs.PICA_PRINT_FAVS && env.CODEX_PICA_RANDOM_IDS == '' }}
        run: pnpm start

      - name: Download encrypted speed-test selection
        if: ${{ !inputs.PICA_PRINT_FAVS && env.CODEX_PICA_RANDOM_IDS != '' }}
        id: speed-download
        timeout-minutes: 90
        run: |
          started_at=$(date +%s)
          pnpm start > "$RUNNER_TEMP/pica-download.log" 2>&1
          if [ ! -d comics ] || ! find comics -type f ! -name done.txt -print -quit | grep -q .; then
            echo "Download produced no image files"
            exit 1
          fi
          finished_at=$(date +%s)
          seconds=$((finished_at - started_at))
          files=$(find comics -type f ! -name done.txt | wc -l)
          bytes=$(find comics -type f ! -name done.txt -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          echo "Pica download completed: ${files} files, ${bytes} bytes, ${seconds} seconds"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"

      - name: Compress
        if: ${{ !inputs.PICA_PRINT_FAVS && inputs.OUTPUT_ZIP && env.CODEX_PICA_RANDOM_IDS == '' }}
        run: pnpm start:zip

      - name: Upload to github
        if: ${{ !inputs.PICA_PRINT_FAVS && env.CODEX_PICA_RANDOM_IDS == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pica-comics
          path: ${{ inputs.OUTPUT_ZIP && 'comics-zip/' || 'comics/' }}
          retention-days: 7

      - name: Upload to file.io
        if: ${{ !inputs.PICA_PRINT_FAVS && inputs.UPLOAD_FILEIO && env.CODEX_PICA_RANDOM_IDS == '' }}
        run: node scripts/upload.js

      - name: Package and encrypt speed-test download
        if: ${{ !inputs.PICA_PRINT_FAVS && env.CODEX_PICA_RANDOM_IDS != '' }}
        run: |
          tar -czf pica-random-3.tar.gz comics
          openssl rand -hex 32 > download-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in pica-random-3.tar.gz -out pica-random-3.tar.gz.enc -pass file:download-passphrase.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/export-public.pem -in download-passphrase.txt -out download-passphrase.txt.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm pica-random-3.tar.gz download-passphrase.txt

      - name: Upload encrypted speed-test download
        if: ${{ !inputs.PICA_PRINT_FAVS && env.CODEX_PICA_RANDOM_IDS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-pica-random-3
          path: |
            pica-random-3.tar.gz.enc
            download-passphrase.txt.enc
          retention-days: 1

      - name: Export favorites without logging titles
        if: inputs.PICA_PRINT_FAVS
        env:
          DEBUG: ''
        run: pnpm exec tsx scripts/export-favorites.ts

      - name: Encrypt favorites export
        if: inputs.PICA_PRINT_FAVS
        run: |
          openssl rand -hex 32 > export-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in favorites.csv -out favorites.csv.enc -pass file:export-passphrase.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/export-public.pem -in export-passphrase.txt -out export-passphrase.txt.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm favorites.csv export-passphrase.txt

      - name: Upload encrypted favorites
        if: inputs.PICA_PRINT_FAVS
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-favorites
          path: |
            favorites.csv.enc
            export-passphrase.txt.enc
          retention-days: 1
